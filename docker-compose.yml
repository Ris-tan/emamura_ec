services:
  postgres:
    image: postgres:16
    container_name: emamura_postgres
    environment:
      POSTGRES_DB: emamura_ec
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - emamura_postgres_data:/var/lib/postgresql/data

volumes:
  emamura_postgres_data: