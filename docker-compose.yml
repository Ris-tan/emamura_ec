services:
  postgres:
    image: postgres:16
    container_name: emamura_postgres
    environment:
      POSTGRES_DB: emamura_ec
      POSTGRES_USER: emamura_app
      POSTGRES_PASSWORD: emamura_dev
    ports:
      - "5432:5432"
    volumes:
      - emamura_postgres_data:/var/lib/postgresql/data

volumes:
  emamura_postgres_data: