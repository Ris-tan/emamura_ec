spring.application.name=emamura_ec

server.port=${PORT:8081}

spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/emamura_ec}
spring.datasource.username=${DB_USERNAME:emamura_app}
spring.datasource.password=${DB_PASSWORD:emamura_dev}

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=true

# LINE Login
line.login.channel-id=${LINE_LOGIN_CHANNEL_ID}
line.login.channel-secret=${LINE_LOGIN_CHANNEL_SECRET}

# LINE Messaging API
line.messaging.channel-access-token=${LINE_MESSAGING_CHANNEL_ACCESS_TOKEN}