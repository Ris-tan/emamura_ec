<!DOCTYPE html>
<html lang="ja" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head(${product.productName})}"></head>
<body>
<header th:replace="~{fragments/layout :: header}"></header>

<main class="page-container">
    <a class="back-link" th:href="@{/products}">← 商品一覧へ戻る</a>
    <div class="product-detail">
        <img class="product-detail__image"
             th:src="@{${product.imageUrl}}"
             th:alt="${product.productName}">

        <section class="product-detail__info">
            <h1 th:text="${product.productName}">商品名</h1>
            <p class="price"><span th:text="${product.price}">0</span>円</p>
            <p class="product-description" th:text="${product.description}">商品の説明</p>

            <p class="error" th:if="${cartError}" th:text="${cartError}"></p>
            <form th:action="@{/cart/items}" method="post">
                <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">
                <input type="hidden" name="productId" th:value="${product.productId}">
                <div class="form-group">
                    <label class="required" for="quantity">数量</label>
                    <input id="quantity" name="quantity" type="number" min="1"
                           th:max="${product.stock}" value="1">
                    <p class="help-text">在庫：<span th:text="${product.stock}">0</span>点</p>
                </div>
                <button class="btn btn-primary" type="submit">カートに追加</button>
            </form>
        </section>
    </div>
</main>

<footer th:replace="~{fragments/layout :: footer}"></footer>
</body>
</html>
