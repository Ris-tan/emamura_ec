<!DOCTYPE html>
<html lang="ja" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title th:text="${product.productName}">商品詳細</title>
    <style>
        .product-detail {
            max-width: 720px;
            margin: 0 auto;
        }

        .product-detail img {
            width: 100%;
            max-width: 480px;
            aspect-ratio: 4 / 3;
            object-fit: cover;
        }
    </style>
</head>
<body>
    <main class="product-detail">
        <p><a th:href="@{/products}">商品一覧に戻る</a></p>
        <h1 th:text="${product.productName}">商品名</h1>
        <img th:src="@{${product.imageUrl}}" alt="商品画像" />
        <p><span th:text="${product.price}">0</span>円</p>
        <p th:text="${product.description}">商品説明</p>
    </main>
</body>
</html>
