<!DOCTYPE html>
<html lang="ja" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('お届け先 | 花屋いまむら')}"></head>
<body>
<header th:replace="~{fragments/layout :: header}"></header>

<main class="page-container narrow-container">
    <a class="back-link" th:href="@{/mypage/addresses}">← お届け先一覧へ戻る</a>
    <header class="page-header">
        <h1 th:text="${addressFormTitle}">お届け先</h1>
    </header>

    <form class="form-card" th:action="${addressFormAction}"
          th:object="${userAddressForm}" method="post">
        <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">

        <div class="form-group">
            <label class="required" for="recipientName">受取人氏名</label>
            <input id="recipientName" type="text" th:field="*{recipientName}" autocomplete="name">
            <p class="error" th:if="${#fields.hasErrors('recipientName')}" th:errors="*{recipientName}"></p>
        </div>

        <div class="form-group">
            <label class="required" for="phoneNumber">電話番号</label>
            <input id="phoneNumber" type="tel" th:field="*{phoneNumber}" autocomplete="tel">
            <p class="error" th:if="${#fields.hasErrors('phoneNumber')}" th:errors="*{phoneNumber}"></p>
        </div>

        <div class="form-group">
            <label class="required" for="postalCode">郵便番号</label>
            <div class="postal-code-row">
                <input id="postalCode" type="text" th:field="*{postalCode}"
                       inputmode="numeric" autocomplete="postal-code" placeholder="123-4567">
                <button class="btn btn-secondary" type="button"
                        data-address-search
                        data-postal-code-input="postalCode"
                        data-prefecture-input="prefecture"
                        data-address-line-input="addressLine"
                        data-message="addressSearchMessage">郵便番号から住所検索</button>
            </div>
            <p id="addressSearchMessage" class="api-message" role="status"></p>
            <p class="error" th:if="${#fields.hasErrors('postalCode')}" th:errors="*{postalCode}"></p>
        </div>

        <div class="form-group">
            <label class="required" for="prefecture">都道府県</label>
            <input id="prefecture" type="text" th:field="*{prefecture}" autocomplete="address-level1">
            <p class="error" th:if="${#fields.hasErrors('prefecture')}" th:errors="*{prefecture}"></p>
        </div>

        <div class="form-group">
            <label class="required" for="addressLine">住所（市区町村・町域・番地・建物名）</label>
            <textarea id="addressLine" th:field="*{addressLine}"
                      autocomplete="street-address"></textarea>
            <p class="help-text">郵便番号検索で市区町村・町域まで入力されます。番地・建物名を続けて入力してください。</p>
            <p class="error" th:if="${#fields.hasErrors('addressLine')}" th:errors="*{addressLine}"></p>
        </div>

        <label class="check-row">
            <input type="checkbox" th:field="*{defaultAddress}">
            既定のお届け先にする
        </label>

        <div class="error" th:if="${#fields.hasGlobalErrors()}">
            <p th:each="error : ${#fields.globalErrors()}" th:text="${error}"></p>
        </div>

        <div class="actions">
            <a class="btn btn-secondary" th:href="@{/mypage/addresses}">キャンセル</a>
            <button class="btn btn-primary" type="submit" th:text="${addressFormSubmitLabel}">保存する</button>
        </div>
    </form>
</main>

<footer th:replace="~{fragments/layout :: footer}"></footer>
<script th:src="@{/js/address-search.js}"></script>
</body>
</html>
