<!DOCTYPE html>
<html lang="ja" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('お届け先管理 | 花屋いまむら')}"></head>
<body>
<header th:replace="~{fragments/layout :: header}"></header>

<main class="page-container">
    <a class="back-link" th:href="@{/mypage}">← マイページへ戻る</a>
    <header class="page-header">
        <h1>保存済みお届け先</h1>
        <p>よく使うお届け先を登録して、購入手続きを簡単にできます。</p>
    </header>

    <p class="success" th:if="${addressMessage}" th:text="${addressMessage}"></p>
    <p class="error" th:if="${addressError}" th:text="${addressError}"></p>

    <section class="card" th:if="${#lists.isEmpty(addresses)}">
        <p>保存されているお届け先はありません。</p>
        <a class="btn btn-primary" th:href="@{/mypage/addresses/new}">新しいお届け先を登録</a>
    </section>

    <div class="address-list" th:unless="${#lists.isEmpty(addresses)}">
        <article class="card address-card" th:each="address : ${addresses}">
            <div class="address-card__header">
                <h2 th:text="${address.recipientName}">受取人名</h2>
                <span class="badge" th:if="${address.defaultAddress}">既定のお届け先</span>
            </div>
            <p>〒<span th:text="${address.postalCode}">000-0000</span></p>
            <p><span th:text="${address.prefecture}">都道府県</span><span th:text="${address.addressLine}">住所</span></p>
            <p th:text="${address.phoneNumber}">電話番号</p>

            <div class="address-card__actions">
                <a class="btn btn-secondary"
                   th:href="@{/mypage/addresses/{id}/edit(id=${address.userAddressId})}">編集</a>
                <form th:if="${!address.defaultAddress}"
                      th:action="@{/mypage/addresses/{id}/default(id=${address.userAddressId})}"
                      method="post">
                    <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">
                    <button class="btn btn-secondary" type="submit">既定に設定</button>
                </form>
                <form th:action="@{/mypage/addresses/{id}/delete(id=${address.userAddressId})}"
                      method="post">
                    <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">
                    <button class="btn btn-danger" type="submit">削除</button>
                </form>
            </div>
        </article>
    </div>

    <a class="btn btn-primary" th:unless="${#lists.isEmpty(addresses)}"
       th:href="@{/mypage/addresses/new}">新しいお届け先を登録</a>
</main>

<footer th:replace="~{fragments/layout :: footer}"></footer>
</body>
</html>
