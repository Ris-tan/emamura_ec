<!DOCTYPE html>
<html lang="ja" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('注文詳細 | 花屋いまむら')}"></head>
<body>
<header th:replace="~{fragments/layout :: header}"></header>

<main class="page-container checkout-layout">
    <a class="back-link" th:href="@{/orders}">← 注文履歴へ戻る</a>
    <header class="page-header">
        <h1>注文詳細</h1>
    </header>

    <section class="summary-card">
        <h2>注文情報</h2>
        <dl>
            <dt>注文番号</dt>
            <dd>#<span th:text="${orderDetail.orderId}">0</span></dd>
            <dt>注文日時</dt>
            <dd th:text="${orderDetail.orderDateDisplay}">2026/08/26 15:30</dd>
            <dt>注文ステータス</dt>
            <dd th:text="${orderDetail.orderStatusDisplayName}">注文受付済み</dd>
            <dt>受取方法</dt>
            <dd th:text="${orderDetail.deliveryMethodDisplayName}">お届け</dd>
            <dt>支払方法</dt>
            <dd th:text="${orderDetail.paymentMethodDisplayName}">代金引換</dd>
        </dl>
    </section>

    <section class="summary-card">
        <h2>商品</h2>
        <div class="table-wrap">
            <table class="responsive-table">
                <thead>
                <tr>
                    <th>商品名</th>
                    <th>注文時単価</th>
                    <th>数量</th>
                    <th>小計</th>
                    <th>ラッピング</th>
                    <th>リボン</th>
                    <th>メッセージ</th>
                </tr>
                </thead>
                <tbody>
                <tr th:each="item : ${orderDetail.items}">
                    <td data-label="商品名" th:text="${item.productName}">商品名</td>
                    <td data-label="注文時単価"><span th:text="${item.unitPrice}">0</span>円</td>
                    <td data-label="数量" th:text="${item.quantity}">0</td>
                    <td data-label="小計"><span th:text="${item.subtotal}">0</span>円</td>
                    <td data-label="ラッピング" th:text="${item.wrappingDisplayName}">なし</td>
                    <td data-label="リボン" th:text="${item.ribbonDisplayName}">なし</td>
                    <td data-label="メッセージ">
                        <span th:if="${not #strings.isEmpty(item.messageText)}" th:text="${item.messageText}">メッセージ</span>
                        <span th:unless="${not #strings.isEmpty(item.messageText)}">なし</span>
                    </td>
                </tr>
                </tbody>
            </table>
        </div>
    </section>

    <section class="summary-card" th:if="${orderDetail.deliveryAddressVisible}">
        <h2>配送先</h2>
        <dl>
            <dt>受取人氏名</dt>
            <dd th:text="${orderDetail.recipientName}">受取人氏名</dd>
            <dt>電話番号</dt>
            <dd th:text="${orderDetail.phoneNumber}">電話番号</dd>
            <dt>郵便番号</dt>
            <dd th:text="${orderDetail.postalCode}">郵便番号</dd>
            <dt>都道府県</dt>
            <dd th:text="${orderDetail.prefecture}">都道府県</dd>
            <dt>住所</dt>
            <dd th:text="${orderDetail.addressLine}">住所</dd>
            <dt th:if="${orderDetail.requestedDeliveryDateVisible}">お届け希望日</dt>
            <dd th:if="${orderDetail.requestedDeliveryDateVisible}"
                th:text="${orderDetail.requestedDeliveryDateDisplay}">指定なし</dd>
        </dl>
    </section>
    <section class="summary-card" th:unless="${orderDetail.deliveryAddressVisible}">
        <h2>受取場所</h2>
        <p>店頭受取</p>
    </section>

    <section class="summary-card">
        <h2>金額</h2>
        <div class="amount-list">
            <div class="amount-row"><span>商品小計</span><span><span th:text="${orderDetail.productSubtotal}">0</span>円</span></div>
            <div class="amount-row" th:if="${orderDetail.shippingFeeVisible}">
                <span>送料</span><span><span th:text="${orderDetail.shippingFee}">0</span>円</span>
            </div>
            <div class="amount-row"><span>紙袋数量</span><span><span th:text="${orderDetail.paperBagCount}">0</span>枚</span></div>
            <div class="amount-row"><span>紙袋単価</span><span><span th:text="${orderDetail.paperBagUnitPrice}">50</span>円</span></div>
            <div class="amount-row"><span>紙袋料金</span><span><span th:text="${orderDetail.paperBagTotal}">0</span>円</span></div>
            <div class="amount-row total"><span>合計</span><span><span th:text="${orderDetail.totalAmount}">0</span>円</span></div>
        </div>
    </section>
</main>

<footer th:replace="~{fragments/layout :: footer}"></footer>
</body>
</html>
