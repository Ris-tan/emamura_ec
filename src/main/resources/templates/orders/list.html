<!DOCTYPE html>
<html lang="ja" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>注文履歴</title>
    <style>
        main {
            max-width: 900px;
            margin: 0 auto;
        }

        table {
            width: 100%;
            border-collapse: collapse;
        }

        th,
        td {
            border-bottom: 1px solid #ddd;
            padding: 0.75rem;
            text-align: left;
        }

        .error {
            color: #b00020;
        }
    </style>
</head>
<body>
<main>
    <p><a th:href="@{/}">トップページへ戻る</a></p>
    <h1>注文履歴</h1>

    <p class="error" th:if="${orderError}" th:text="${orderError}"></p>

    <div th:if="${#lists.isEmpty(orders)}">
        <p>注文履歴はまだありません。</p>
        <p><a th:href="@{/products}">商品を見る</a></p>
    </div>

    <table th:unless="${#lists.isEmpty(orders)}">
        <thead>
        <tr>
            <th>注文番号</th>
            <th>注文日時</th>
            <th>注文ステータス</th>
            <th>合計金額</th>
            <th>受取方法</th>
            <th></th>
        </tr>
        </thead>
        <tbody>
        <tr th:each="order : ${orders}">
            <td>#<span th:text="${order.orderId}">0</span></td>
            <td th:text="${order.orderDateDisplay}">2026/08/26 15:30</td>
            <td th:text="${order.orderStatusDisplayName}">注文受付</td>
            <td><span th:text="${order.totalAmount}">0</span>円</td>
            <td th:text="${order.deliveryMethodDisplayName}">お届け</td>
            <td>
                <a th:href="@{/orders/{id}(id=${order.orderId})}">詳細を見る</a>
            </td>
        </tr>
        </tbody>
    </table>
</main>
</body>
</html>
