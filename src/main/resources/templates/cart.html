<!DOCTYPE html>
<html lang="ja" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>カート</title>
    <style>
        main {
            max-width: 900px;
            margin: 0 auto;
        }

        table {
            width: 100%;
            border-collapse: collapse;
        }

        th,
        td {
            border-bottom: 1px solid #ddd;
            padding: 0.75rem;
            text-align: left;
            vertical-align: middle;
        }

        .cart-image {
            width: 120px;
            height: 90px;
            object-fit: cover;
        }

        .quantity-form,
        .delete-form {
            display: inline-block;
        }

        .quantity-form input {
            width: 4rem;
        }

        .error {
            color: #b00020;
        }
    </style>
</head>
<body>
    <main>
        <p><a th:href="@{/products}">商品一覧に戻る</a></p>
        <h1>カート</h1>

        <p class="error" th:if="${cartError}" th:text="${cartError}"></p>

        <div th:if="${#lists.isEmpty(cart.items)}">
            <p>カートに商品はありません。</p>
        </div>

        <div th:unless="${#lists.isEmpty(cart.items)}">
            <table>
                <thead>
                    <tr>
                        <th>商品</th>
                        <th>単価</th>
                        <th>数量</th>
                        <th>小計</th>
                        <th></th>
                    </tr>
                </thead>
                <tbody>
                    <tr th:each="item : ${cart.items}">
                        <td>
                            <img class="cart-image"
                                 th:src="@{${item.product.imageUrl}}"
                                 th:alt="${item.product.productName}">
                            <p th:text="${item.product.productName}">商品名</p>
                        </td>
                        <td><span th:text="${item.product.price}">0</span>円</td>
                        <td>
                            <form class="quantity-form"
                                  th:action="@{/cart/items/{id}(id=${item.product.productId})}"
                                  method="post">
                                <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">
                                <input type="number" name="quantity" min="1"
                                       th:max="${item.product.stock}"
                                       th:value="${item.quantity}">
                                <button type="submit">変更</button>
                            </form>
                        </td>
                        <td><span th:text="${item.subtotal}">0</span>円</td>
                        <td>
                            <form class="delete-form"
                                  th:action="@{/cart/items/{id}/delete(id=${item.product.productId})}"
                                  method="post">
                                <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">
                                <button type="submit">削除</button>
                            </form>
                        </td>
                    </tr>
                </tbody>
            </table>

            <p>合計：<strong th:text="${cart.total}">0</strong>円</p>
        </div>
    </main>
</body>
</html>
