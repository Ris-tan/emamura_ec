<!DOCTYPE html>
<html lang="ja" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('カート | 花屋いまむら')}"></head>
<body>
<header th:replace="~{fragments/layout :: header}"></header>

<main class="page-container">
    <header class="page-header">
        <h1>カート</h1>
        <p>ご注文の商品をご確認ください。</p>
    </header>

    <p class="error" th:if="${cartError}" th:text="${cartError}"></p>

    <section class="card" th:if="${#lists.isEmpty(cart.items)}">
        <p>カートに商品はありません。</p>
        <a class="btn btn-primary" th:href="@{/products}">商品を探す</a>
    </section>

    <div th:unless="${#lists.isEmpty(cart.items)}">
        <div class="table-wrap">
            <table class="responsive-table cart-table">
                <thead>
                <tr>
                    <th>商品</th>
                    <th>単価</th>
                    <th>数量</th>
                    <th>小計</th>
                    <th>操作</th>
                </tr>
                </thead>
                <tbody>
                <tr th:each="item : ${cart.items}">
                    <td data-label="商品">
                        <div class="cart-product">
                            <img class="cart-image"
                                 th:src="@{${item.product.imageUrl}}"
                                 th:alt="${item.product.productName}">
                            <p th:text="${item.product.productName}">商品名</p>
                        </div>
                    </td>
                    <td data-label="単価"><span th:text="${item.product.price}">0</span>円</td>
                    <td data-label="数量">
                        <form class="quantity-form"
                              th:action="@{/cart/items/{id}(id=${item.product.productId})}"
                              method="post">
                            <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">
                            <input type="number" name="quantity" min="1"
                                   th:max="${item.product.stock}"
                                   th:value="${item.quantity}">
                            <button class="btn btn-secondary" type="submit">変更</button>
                        </form>
                    </td>
                    <td data-label="小計"><span th:text="${item.subtotal}">0</span>円</td>
                    <td data-label="操作">
                        <form class="delete-form"
                              th:action="@{/cart/items/{id}/delete(id=${item.product.productId})}"
                              method="post">
                            <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">
                            <button class="btn btn-danger" type="submit">削除</button>
                        </form>
                    </td>
                </tr>
                </tbody>
            </table>
        </div>

        <p class="cart-total">カート合計：<strong th:text="${cart.total}">0</strong>円</p>

        <form class="checkout-start" th:action="@{/checkout/start}" method="post">
            <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">
            <label class="check-row">
                <input type="checkbox" name="giftOption" value="true">
                ギフトオプションを利用する
            </label>
            <button class="btn btn-primary" type="submit">購入手続きへ</button>
        </form>
    </div>
</main>

<footer th:replace="~{fragments/layout :: footer}"></footer>
</body>
</html>
