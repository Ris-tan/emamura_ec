<!DOCTYPE html>
<html lang="ja" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('商品管理 | 花屋いまむら')}"></head>
<body>
<header th:replace="~{fragments/layout :: header}"></header>

<main class="page-container">
    <a class="back-link" th:href="@{/admin/products}">← 商品一覧へ戻る</a>
    <header class="page-header">
        <h1 class="admin-title" th:text="${productFormTitle}">商品を編集</h1>
    </header>

    <form class="form-card admin-product-form" th:action="${productFormAction}"
          th:object="${productForm}" method="post">
        <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">

        <div class="form-group">
            <label class="required" for="productName">商品名</label>
            <input id="productName" type="text" th:field="*{productName}" maxlength="100">
            <p class="error" th:if="${#fields.hasErrors('productName')}" th:errors="*{productName}"></p>
        </div>

        <div class="form-group">
            <label class="required" for="categoryId">カテゴリ</label>
            <select id="categoryId" th:field="*{categoryId}">
                <option value="">選択してください</option>
                <option th:each="category : ${categories}"
                        th:value="${category.categoryId}"
                        th:text="${category.categoryName}">花束</option>
            </select>
            <p class="error" th:if="${#fields.hasErrors('categoryId')}" th:errors="*{categoryId}"></p>
        </div>

        <div class="form-group">
            <label for="description">商品説明</label>
            <textarea id="description" th:field="*{description}" maxlength="1000"></textarea>
            <p class="error" th:if="${#fields.hasErrors('description')}" th:errors="*{description}"></p>
        </div>

        <div class="form-group">
            <label class="required" for="price">価格</label>
            <input id="price" type="number" th:field="*{price}" min="0">
            <p class="error" th:if="${#fields.hasErrors('price')}" th:errors="*{price}"></p>
        </div>

        <div class="form-group">
            <label class="required" for="stock">在庫数</label>
            <input id="stock" type="number" th:field="*{stock}" min="0">
            <p class="error" th:if="${#fields.hasErrors('stock')}" th:errors="*{stock}"></p>
        </div>

        <div class="form-group">
            <label for="imageUrl">商品画像パス</label>
            <input id="imageUrl" type="text" th:field="*{imageUrl}" maxlength="500"
                   placeholder="/images/flower.jpg">
            <p class="help-text">今回は画像アップロードを行わず、既存の画像パスを入力します。</p>
            <p class="error" th:if="${#fields.hasErrors('imageUrl')}" th:errors="*{imageUrl}"></p>
        </div>

        <label class="check-row">
            <input type="checkbox" th:field="*{isActive}">
            販売中
        </label>

        <div class="error" th:if="${#fields.hasGlobalErrors()}" role="alert">
            <p th:each="error : ${#fields.globalErrors()}" th:text="${error}">入力内容を確認してください。</p>
        </div>

        <div class="actions">
            <a class="btn btn-secondary" th:href="@{/admin/products}">キャンセル</a>
            <button class="btn btn-primary" type="submit" th:text="${productFormSubmitLabel}">保存する</button>
        </div>
    </form>
</main>

<footer th:replace="~{fragments/layout :: footer}"></footer>
</body>
</html>
