<!DOCTYPE html>
<html lang="ja" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>管理者 - 注文管理</title>
    <style>
        main { max-width: 1100px; margin: 0 auto; }
        table { width: 100%; border-collapse: collapse; }
        th, td { border-bottom: 1px solid #ddd; padding: 0.75rem; text-align: left; vertical-align: top; }
        .message { color: #166534; }
        .error { color: #b91c1c; }
    </style>
</head>
<body>
<main>
    <p><a th:href="@{/}">トップページへ戻る</a></p>
    <h1>管理者 - 注文管理</h1>

    <p class="message" th:if="${adminOrderMessage}" th:text="${adminOrderMessage}">完了しました。</p>
    <p class="error" th:if="${adminOrderError}" th:text="${adminOrderError}">エラーが発生しました。</p>

    <p th:if="${#lists.isEmpty(orders)}">現在、注文はありません。</p>
    <table th:unless="${#lists.isEmpty(orders)}">
        <thead>
        <tr>
            <th>注文番号</th>
            <th>注文日時</th>
            <th>注文者</th>
            <th>メールアドレス</th>
            <th>受取方法</th>
            <th>注文ステータス</th>
            <th>合計金額</th>
            <th></th>
        </tr>
        </thead>
        <tbody>
        <tr th:each="order : ${orders}">
            <td>#<span th:text="${order.orderId}">15</span></td>
            <td th:text="${order.orderDateDisplay}">2026/08/27 10:30</td>
            <td th:text="${order.userName}">山田 太郎</td>
            <td th:text="${order.userEmail}">example@example.com</td>
            <td th:text="${order.deliveryMethodDisplayName}">お届け</td>
            <td th:text="${order.orderStatusDisplayName}">注文受付</td>
            <td><span th:text="${order.totalAmount}">6500</span>円</td>
            <td><a th:href="@{/admin/orders/{id}(id=${order.orderId})}">詳細を見る</a></td>
        </tr>
        </tbody>
    </table>
</main>
</body>
</html>
