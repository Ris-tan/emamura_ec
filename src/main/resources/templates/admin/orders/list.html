<!DOCTYPE html>
<html lang="ja" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('管理者 - 注文管理 | 花屋いまむら')}"></head>
<body>
<header th:replace="~{fragments/layout :: header}"></header>

<main class="page-container">
    <a class="back-link" th:href="@{/}">← トップページへ戻る</a>
    <header class="page-header">
        <h1 class="admin-title">管理者 - 注文管理</h1>
        <p>全ユーザーの注文を管理します。</p>
    </header>

    <p class="success" th:if="${adminOrderMessage}" th:text="${adminOrderMessage}">完了しました。</p>
    <p class="error" th:if="${adminOrderError}" th:text="${adminOrderError}">エラーが発生しました。</p>

    <section class="card" th:if="${#lists.isEmpty(orders)}">
        <p>現在、注文はありません。</p>
    </section>

    <div class="table-wrap" th:unless="${#lists.isEmpty(orders)}">
        <table class="responsive-table admin-orders-table">
            <thead>
            <tr>
                <th>注文番号</th>
                <th>注文日時</th>
                <th>注文者</th>
                <th>メールアドレス</th>
                <th>受取方法</th>
                <th>注文ステータス</th>
                <th>合計金額</th>
                <th></th>
            </tr>
            </thead>
            <tbody>
            <tr th:each="order : ${orders}">
                <td data-label="注文番号">#<span th:text="${order.orderId}">15</span></td>
                <td data-label="注文日時" th:text="${order.orderDateDisplay}">2026/08/27 10:30</td>
                <td data-label="注文者" th:text="${order.userName}">山田 太郎</td>
                <td data-label="メールアドレス" th:text="${order.userEmail}">example@example.com</td>
                <td data-label="受取方法" th:text="${order.deliveryMethodDisplayName}">お届け</td>
                <td data-label="注文ステータス" th:text="${order.orderStatusDisplayName}">注文受付</td>
                <td data-label="合計金額"><span th:text="${order.totalAmount}">6500</span>円</td>
                <td data-label="詳細"><a th:href="@{/admin/orders/{id}(id=${order.orderId})}">詳細を見る</a></td>
            </tr>
            </tbody>
        </table>
    </div>
</main>

<footer th:replace="~{fragments/layout :: footer}"></footer>
</body>
</html>
