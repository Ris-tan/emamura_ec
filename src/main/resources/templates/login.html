<!DOCTYPE html>
<html lang="ja" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('ログイン | 花屋いまむら')}"></head>
<body>
<header th:replace="~{fragments/layout :: header}"></header>

<main class="page-container narrow-container">
    <a class="back-link" th:href="@{/}">← トップページへ戻る</a>
    <header class="page-header">
        <h1>ログイン</h1>
        <p>メールアドレスとパスワードを入力してください。</p>
    </header>

    <div class="form-card">
        <p class="error" th:if="${param.error}">メールアドレスまたはパスワードが正しくありません。</p>
        <p class="success" th:if="${param.logout}">ログアウトしました。</p>

        <form th:action="@{/login}" method="post">
            <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">

            <div class="form-group">
                <label class="required" for="email">メールアドレス</label>
                <input id="email" name="email" type="email" autocomplete="email" required>
            </div>

            <div class="form-group">
                <label class="required" for="password">パスワード</label>
                <input id="password" name="password" type="password" autocomplete="current-password" required>
            </div>

            <button class="btn btn-primary" type="submit">ログイン</button>
        </form>
        <p class="form-note">アカウントをお持ちでない方は、<a th:href="@{/register}">会員登録</a>へ進んでください。</p>
    </div>
</main>

<footer th:replace="~{fragments/layout :: footer}"></footer>
</body>
</html>
