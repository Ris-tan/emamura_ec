<!DOCTYPE html>
<html lang="ja" xmlns:th="http://www.thymeleaf.org">
<head th:fragment="head(title)">
    <!-- 共通head: すべての画面で文字コード、viewport、共通CSSを統一する -->
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title th:text="${title}">花屋いまむら</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>
<header th:fragment="header" class="site-header">
    <!-- 共通header: 認証状態に応じて一般利用者向け導線を切り替える -->
    <div class="site-header__inner">
        <a class="site-brand" th:href="@{/}">花屋いまむら</a>
        <nav class="site-nav" aria-label="メインメニュー">
            <a th:href="@{/products}">商品一覧</a>
            <a th:href="@{/cart}">カート</a>
            <a th:if="${isAuthenticated}" th:href="@{/mypage}">マイページ</a>
            <a th:if="${isAuthenticated}" th:href="@{/orders}">注文履歴</a>
            <a th:if="${isAdmin}" th:href="@{/admin/orders}">注文管理</a>
            <a th:if="${isAdmin}" th:href="@{/admin/products}">商品管理</a>
            <a th:if="${!isAuthenticated}" th:href="@{/login}">ログイン</a>
            <a th:if="${!isAuthenticated}" th:href="@{/register}">会員登録</a>
            <form th:if="${isAuthenticated}" class="logout-form"
                  th:action="@{/logout}" method="post">
                <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">
                <button class="nav-button" type="submit">ログアウト</button>
            </form>
        </nav>
    </div>
</header>

<nav th:fragment="checkoutSteps(current, giftEnabled)" class="checkout-steps" aria-label="購入手続きの進捗">
    <ol>
        <li th:classappend="${current == 'gift'} ? ' is-current' : ''">
            <a th:if="${giftEnabled}" th:href="@{/checkout/gift}">ギフト</a>
            <span th:unless="${giftEnabled}">ギフト（任意）</span>
        </li>
        <li th:classappend="${current == 'delivery'} ? ' is-current' : ''">
            <a th:href="@{/checkout/delivery}">配送</a>
        </li>
        <li th:classappend="${current == 'confirm'} ? ' is-current' : ''">確認</li>
        <li th:classappend="${current == 'complete'} ? ' is-current' : ''">完了</li>
    </ol>
</nav>

<footer th:fragment="footer" class="site-footer">
    <!-- 共通footer: 店舗名とポートフォリオ用途を全画面で統一して表示する -->
    <p>© 花屋いまむら</p>
    <p>本サイトは個人開発によるポートフォリオです。</p>
</footer>
</body>
</html>
