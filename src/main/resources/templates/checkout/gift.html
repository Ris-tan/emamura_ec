<!DOCTYPE html>
<html lang="ja" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>ギフト設定</title>
    <style>
        main {
            max-width: 820px;
            margin: 0 auto;
        }

        .gift-item {
            border-bottom: 1px solid #ddd;
            padding: 1rem 0;
        }

        .gift-item img {
            width: 120px;
            height: 90px;
            object-fit: cover;
        }

        label {
            display: block;
            margin-top: 0.75rem;
            margin-bottom: 0.25rem;
        }

        select,
        textarea,
        input {
            box-sizing: border-box;
            max-width: 100%;
            padding: 0.5rem;
        }

        textarea {
            width: 100%;
            min-height: 5rem;
        }

        .error {
            color: #b00020;
        }

        .notice {
            padding: 0.75rem;
            background: #f5f5f5;
        }
    </style>
</head>
<body>
    <main>
        <p><a th:href="@{/checkout/delivery/confirm}">配送内容確認に戻る</a></p>
        <h1>ギフト設定</h1>

        <p class="notice">
            同じ商品を複数点ご購入の場合、ラッピング・リボン・メッセージカードの内容はすべて共通となります。<br>
            商品ごとに異なる内容をご希望の場合は、注文を分けてご購入ください。
        </p>

        <p class="notice" th:if="${giftSaved}">ギフト設定をSessionへ保存しました。</p>
        <p class="error" th:if="${giftError}" th:text="${giftError}"></p>

        <form th:action="@{/checkout/gift}"
              th:object="${checkoutGiftForm}"
              method="post">
            <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">

            <section class="gift-item" th:each="item, stat : *{items}">
                <img th:src="${item.imageUrl}" th:alt="${item.productName}">
                <h2 th:text="${item.productName}">商品名</h2>
                <p>数量：<span th:text="${item.quantity}">0</span></p>

                <input type="hidden" th:field="*{items[__${stat.index}__].productId}">
                <input type="hidden" th:field="*{items[__${stat.index}__].quantity}">

                <label th:for="${'wrappingType-' + stat.index}">ラッピング</label>
                <select th:id="${'wrappingType-' + stat.index}"
                        th:field="*{items[__${stat.index}__].wrappingType}">
                    <option th:each="type : ${wrappingTypes}"
                            th:value="${type}"
                            th:text="${type == T(emamura_ec.entity.WrappingType).NONE ? 'なし' : 'ギフトラッピング'}">
                    </option>
                </select>
                <p class="error"
                   th:if="${#fields.hasErrors('items[' + stat.index + '].wrappingType')}"
                   th:errors="*{items[__${stat.index}__].wrappingType}"></p>

                <label th:for="${'ribbonColor-' + stat.index}">リボンカラー</label>
                <select th:id="${'ribbonColor-' + stat.index}"
                        th:field="*{items[__${stat.index}__].ribbonColor}">
                    <option th:each="color : ${ribbonColors}"
                            th:value="${color}"
                            th:text="${color == T(emamura_ec.entity.RibbonColor).NONE ? 'なし' : color}">
                    </option>
                </select>
                <p class="error"
                   th:if="${#fields.hasErrors('items[' + stat.index + '].ribbonColor')}"
                   th:errors="*{items[__${stat.index}__].ribbonColor}"></p>

                <label th:for="${'messageText-' + stat.index}">メッセージカード本文（30文字以内）</label>
                <textarea th:id="${'messageText-' + stat.index}"
                          th:field="*{items[__${stat.index}__].messageText}"
                          maxlength="30"></textarea>
                <p class="error"
                   th:if="${#fields.hasErrors('items[' + stat.index + '].messageText')}"
                   th:errors="*{items[__${stat.index}__].messageText}"></p>
            </section>

            <section>
                <h2>紙袋</h2>
                <p>1枚<span th:text="${paperBagUnitPrice}">50</span>円。注文全体で必要な枚数を入力してください。</p>
                <label for="paperBagCount">紙袋数量</label>
                <input id="paperBagCount" type="number" min="0" th:field="*{paperBagCount}">
                <p class="error" th:if="${#fields.hasErrors('paperBagCount')}" th:errors="*{paperBagCount}"></p>
            </section>

            <button type="submit">ギフト設定を保存する</button>
        </form>
    </main>
</body>
</html>
