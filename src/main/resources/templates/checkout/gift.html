<!DOCTYPE html>
<html lang="ja" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>ギフト設定</title>
    <style>
        main {
            max-width: 820px;
            margin: 0 auto;
        }

        .gift-item {
            border-bottom: 1px solid #ddd;
            padding: 1rem 0;
        }

        .gift-item img {
            width: 120px;
            height: 90px;
            object-fit: cover;
        }

        label {
            display: block;
            margin-top: 0.75rem;
            margin-bottom: 0.25rem;
        }

        .option-label {
            display: inline-block;
            margin-top: 0.75rem;
        }

        select,
        textarea,
        input {
            box-sizing: border-box;
            max-width: 100%;
            padding: 0.5rem;
        }

        select,
        textarea {
            width: 100%;
        }

        textarea {
            min-height: 5rem;
        }

        .error {
            color: #b00020;
        }

        .notice {
            padding: 0.75rem;
            background: #f5f5f5;
        }
    </style>
</head>
<body>
    <main>
        <p><a th:href="@{/cart}">カートに戻る</a></p>
        <h1>ギフト設定</h1>

        <p class="error" th:if="${giftError}" th:text="${giftError}"></p>

        <form th:action="@{/checkout/gift}"
              th:object="${checkoutGiftForm}"
              method="post">
            <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">

            <section class="gift-item" th:each="item, stat : *{items}">
                <img th:src="${item.imageUrl}" th:alt="${item.productName}">
                <h2 th:text="${item.productName}">商品名</h2>
                <p>数量：<span th:text="${item.quantity}">0</span></p>
                <p class="notice" th:if="${item.quantity > 1}">
                    ※同一商品を複数点購入する場合、ギフト設定は数量分すべて共通です。
                </p>

                <input type="hidden" th:field="*{items[__${stat.index}__].productId}">
                <input type="hidden" th:field="*{items[__${stat.index}__].quantity}">

                <div>
                    <input type="checkbox"
                           th:id="${'wrappingEnabled-' + stat.index}"
                           th:field="*{items[__${stat.index}__].wrappingEnabled}"
                           class="option-toggle">
                    <label class="option-label" th:for="${'wrappingEnabled-' + stat.index}">ラッピングを付ける</label>
                </div>
                <div class="option-control" data-option="wrapping">
                    <label th:for="${'wrappingType-' + stat.index}">種類</label>
                    <select th:id="${'wrappingType-' + stat.index}"
                            th:field="*{items[__${stat.index}__].wrappingType}">
                        <option th:each="type : ${wrappingTypes}"
                                th:value="${type}"
                                th:text="${type.displayName}"></option>
                    </select>
                </div>

                <div>
                    <input type="checkbox"
                           th:id="${'ribbonEnabled-' + stat.index}"
                           th:field="*{items[__${stat.index}__].ribbonEnabled}"
                           class="option-toggle">
                    <label class="option-label" th:for="${'ribbonEnabled-' + stat.index}">リボンを付ける</label>
                </div>
                <div class="option-control" data-option="ribbon">
                    <label th:for="${'ribbonColor-' + stat.index}">色</label>
                    <select th:id="${'ribbonColor-' + stat.index}"
                            th:field="*{items[__${stat.index}__].ribbonColor}">
                        <option th:each="color : ${ribbonColors}"
                                th:value="${color}"
                                th:text="${color.displayName}"></option>
                    </select>
                </div>

                <div>
                    <input type="checkbox"
                           th:id="${'messageEnabled-' + stat.index}"
                           th:field="*{items[__${stat.index}__].messageEnabled}"
                           class="option-toggle">
                    <label class="option-label" th:for="${'messageEnabled-' + stat.index}">メッセージカードを付ける</label>
                </div>
                <div class="option-control" data-option="message">
                    <label th:for="${'messageText-' + stat.index}">メッセージ（30文字以内）</label>
                    <textarea th:id="${'messageText-' + stat.index}"
                              th:field="*{items[__${stat.index}__].messageText}"
                              maxlength="30"></textarea>
                    <p class="error"
                       th:if="${#fields.hasErrors('items[' + stat.index + '].messageText')}"
                       th:errors="*{items[__${stat.index}__].messageText}"></p>
                </div>
            </section>

            <section>
                <h2>紙袋</h2>
                <p>0枚以上、1枚<span th:text="${paperBagUnitPrice}">50</span>円です。</p>
                <label for="paperBagCount">紙袋数量</label>
                <input id="paperBagCount" type="number" min="0" th:field="*{paperBagCount}">
                <p class="error" th:if="${#fields.hasErrors('paperBagCount')}" th:errors="*{paperBagCount}"></p>
            </section>

            <button type="submit">ギフト設定を保存して配送先入力へ進む</button>
        </form>
    </main>

    <script>
        document.querySelectorAll('.gift-item').forEach((item) => {
            const toggles = [
                ['wrappingEnabled', '[data-option="wrapping"]'],
                ['ribbonEnabled', '[data-option="ribbon"]'],
                ['messageEnabled', '[data-option="message"]']
            ];

            toggles.forEach(([fieldName, controlSelector]) => {
                const checkbox = item.querySelector('input[type="checkbox"][name$=".' + fieldName + '"]');
                const control = item.querySelector(controlSelector);
                const input = control.querySelector('select, textarea');

                const updateDisabledState = () => {
                    input.disabled = !checkbox.checked;
                };

                checkbox.addEventListener('change', updateDisabledState);
                updateDisabledState();
            });
        });
    </script>
</body>
</html>
