<!DOCTYPE html>
<html lang="ja" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('受取方法・お届け先 | 花屋いまむら')}"></head>
<body>
<header th:replace="~{fragments/layout :: header}"></header>
<nav th:replace="~{fragments/layout :: checkoutSteps('delivery', false)}"></nav>

<main class="page-container checkout-layout narrow-container">
    <header class="page-header">
        <h1>受取方法・お届け先</h1>
        <p>受取方法とお届け先情報を入力してください。</p>
    </header>

    <p class="error" th:if="${deliveryError}" th:text="${deliveryError}"></p>

    <form class="form-card" th:action="@{/checkout/delivery}"
          th:object="${checkoutDeliveryForm}" method="post">
        <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">

        <div class="form-group">
            <label class="required" for="deliveryOption">受取方法</label>
            <select id="deliveryOption" th:field="*{deliveryOption}">
                <option value="">選択してください</option>
                <option value="DELIVERY">お届け</option>
                <option value="STORE_PICKUP">店頭受取</option>
            </select>
            <p class="error" th:if="${#fields.hasErrors('deliveryOption')}" th:errors="*{deliveryOption}"></p>
            <p class="notice">店頭受取の場合は配送先住所の入力は不要です。受取人氏名と電話番号は入力してください。</p>
        </div>

        <fieldset class="saved-address-selection"
                  th:if="${savedAddresses != null and not #lists.isEmpty(savedAddresses)}"
                  th:classappend="${checkoutDeliveryForm.deliveryOption == 'STORE_PICKUP'} ? ' is-hidden'"
                  data-saved-address-selection>
            <legend>保存済みのお届け先を使う</legend>
            <p class="help-text">登録済みの住所を選ぶと、登録内容をそのまま使用します。</p>

            <div class="saved-address-options">
                <label class="saved-address-option" th:each="address : ${savedAddresses}">
                    <input type="radio" th:field="*{savedAddressId}"
                           th:value="${address.userAddressId}" data-address-selection="saved">
                    <span class="saved-address-option__body">
                        <span class="saved-address-option__header">
                            <strong th:text="${address.recipientName}">受取人氏名</strong>
                            <span class="badge" th:if="${address.defaultAddress}">既定のお届け先</span>
                        </span>
                        <span th:text="${'〒' + address.postalCode}">〒000-0000</span>
                        <span th:text="${address.prefecture + address.addressLine}">都道府県住所</span>
                        <span th:text="${address.phoneNumber}">電話番号</span>
                    </span>
                </label>

                <label class="saved-address-option saved-address-option--new">
                    <input type="radio" th:field="*{savedAddressId}" value=""
                           data-address-selection="new">
                    <span class="saved-address-option__body">
                        <strong>新しいお届け先を入力する</strong>
                    </span>
                </label>
            </div>
        </fieldset>

        <div id="newAddressForm" class="checkout-address-form"
             th:classappend="${checkoutDeliveryForm.savedAddressId != null} ? ' is-hidden'">
        <div class="form-group">
            <label class="required" for="recipientName">受取人氏名</label>
            <input id="recipientName" type="text" th:field="*{recipientName}" autocomplete="name">
            <p class="error" th:if="${#fields.hasErrors('recipientName')}" th:errors="*{recipientName}"></p>
        </div>

        <div class="form-group">
            <label class="required" for="phoneNumber">電話番号</label>
            <input id="phoneNumber" type="tel" th:field="*{phoneNumber}" autocomplete="tel">
            <p class="error" th:if="${#fields.hasErrors('phoneNumber')}" th:errors="*{phoneNumber}"></p>
        </div>

        <fieldset>
            <legend>お届け先住所</legend>

            <div class="form-group">
                <label for="postalCode">郵便番号</label>
                <div class="postal-code-row">
                    <input id="postalCode" type="text" th:field="*{postalCode}"
                           inputmode="numeric" autocomplete="postal-code" placeholder="123-4567">
                    <button class="btn btn-secondary" type="button"
                            data-address-search
                            data-postal-code-input="postalCode"
                            data-prefecture-input="prefecture"
                            data-city-input="cityAddress"
                            data-message="addressSearchMessage">郵便番号から住所検索</button>
                </div>
                <p id="addressSearchMessage" class="api-message" role="status"></p>
                <p class="error" th:if="${#fields.hasErrors('postalCode')}" th:errors="*{postalCode}"></p>
            </div>

            <div class="form-group">
                <label for="prefecture">都道府県</label>
                <input id="prefecture" type="text" th:field="*{prefecture}" autocomplete="address-level1">
                <p class="error" th:if="${#fields.hasErrors('prefecture')}" th:errors="*{prefecture}"></p>
            </div>

            <div class="form-group">
                <label for="cityAddress">市区町村・町域</label>
                <input id="cityAddress" type="text" th:field="*{cityAddress}" autocomplete="address-level2">
                <p class="error" th:if="${#fields.hasErrors('cityAddress')}" th:errors="*{cityAddress}"></p>
            </div>

            <div class="form-group">
                <label for="addressDetail">番地・建物名</label>
                <input id="addressDetail" type="text" th:field="*{addressDetail}"
                       maxlength="255" autocomplete="street-address">
                <p class="error" th:if="${#fields.hasErrors('addressDetail')}" th:errors="*{addressDetail}"></p>
            </div>
        </fieldset>
        </div>

        <div class="error" th:if="${#fields.hasGlobalErrors()}">
            <p th:each="error : ${#fields.globalErrors()}" th:text="${error}"></p>
        </div>

        <button class="btn btn-primary" type="submit">入力内容を確認する</button>
    </form>
</main>

<footer th:replace="~{fragments/layout :: footer}"></footer>

<script th:src="@{/js/address-search.js}"></script>
<script>
    (() => {
        const deliveryOption = document.getElementById('deliveryOption');
        const newAddressForm = document.getElementById('newAddressForm');
        const selectionInputs = document.querySelectorAll('[data-address-selection]');
        const selectionSection = document.querySelector('[data-saved-address-selection]');

        if (!deliveryOption || !newAddressForm || selectionInputs.length === 0) {
            return;
        }

        const updateAddressFormVisibility = () => {
            const isStorePickup = deliveryOption.value === 'STORE_PICKUP';
            const savedAddressSelected = Array.from(selectionInputs)
                .some(input => input.checked && input.dataset.addressSelection === 'saved');
            const hideNewAddressForm = !isStorePickup && savedAddressSelected;

            selectionInputs.forEach(input => {
                const option = input.closest('.saved-address-option');
                if (option) {
                    option.classList.toggle('is-selected', input.checked);
                }
            });
            newAddressForm.classList.toggle('is-hidden', hideNewAddressForm);
            if (selectionSection) {
                selectionSection.classList.toggle('is-hidden', isStorePickup);
            }
        };

        deliveryOption.addEventListener('change', updateAddressFormVisibility);
        selectionInputs.forEach(input => input.addEventListener('change', updateAddressFormVisibility));
        updateAddressFormVisibility();
    })();
</script>
</body>
</html>
