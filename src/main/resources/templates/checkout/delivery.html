<!DOCTYPE html>
<html lang="ja" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>受取方法・お届け先入力</title>
    <style>
        main {
            max-width: 640px;
            margin: 0 auto;
        }

        form {
            display: grid;
            gap: 1rem;
        }

        label {
            display: block;
            margin-bottom: 0.25rem;
        }

        input,
        select {
            box-sizing: border-box;
            width: 100%;
            padding: 0.5rem;
        }

        button {
            padding: 0.5rem 0.75rem;
        }

        .postal-code-row {
            display: flex;
            gap: 0.5rem;
        }

        .postal-code-row input {
            flex: 1;
        }

        .error {
            color: #b00020;
        }

        .api-message {
            min-height: 1.5rem;
            margin: 0.5rem 0 0;
        }

        .notice {
            padding: 0.75rem;
            background: #f5f5f5;
        }
    </style>
</head>
<body>
    <main>
        <p><a th:href="@{/cart}">カートに戻る</a></p>
        <h1>受取方法・お届け先入力</h1>
        <p class="error" th:if="${deliveryError}" th:text="${deliveryError}"></p>

        <form th:action="@{/checkout/delivery}"
              th:object="${checkoutDeliveryForm}"
              method="post">
            <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">

            <div>
                <label for="deliveryOption">受取方法</label>
                <select id="deliveryOption" th:field="*{deliveryOption}">
                    <option value="">選択してください</option>
                    <option value="DELIVERY">お届け</option>
                    <option value="STORE_PICKUP">店頭受取</option>
                </select>
                <p class="error" th:if="${#fields.hasErrors('deliveryOption')}" th:errors="*{deliveryOption}"></p>
                <p class="notice">店頭受取の場合は住所入力は不要です。受取人氏名と電話番号は入力してください。</p>
            </div>

            <div>
                <label for="recipientName">受取人氏名</label>
                <input id="recipientName" type="text" th:field="*{recipientName}">
                <p class="error" th:if="${#fields.hasErrors('recipientName')}" th:errors="*{recipientName}"></p>
            </div>

            <div>
                <label for="phoneNumber">電話番号</label>
                <input id="phoneNumber" type="tel" th:field="*{phoneNumber}">
                <p class="error" th:if="${#fields.hasErrors('phoneNumber')}" th:errors="*{phoneNumber}"></p>
            </div>

            <fieldset>
                <legend>お届け先</legend>

                <div>
                    <label for="postalCode">郵便番号</label>
                    <div class="postal-code-row">
                        <input id="postalCode" type="text" th:field="*{postalCode}"
                               inputmode="numeric" autocomplete="postal-code" placeholder="123-4567">
                        <button id="searchAddress" type="button">住所検索</button>
                    </div>
                    <p id="addressSearchMessage" class="api-message" role="status"></p>
                    <p class="error" th:if="${#fields.hasErrors('postalCode')}" th:errors="*{postalCode}"></p>
                </div>

                <div>
                    <label for="prefecture">都道府県</label>
                    <input id="prefecture" type="text" th:field="*{prefecture}" autocomplete="address-level1">
                    <p class="error" th:if="${#fields.hasErrors('prefecture')}" th:errors="*{prefecture}"></p>
                </div>

                <div>
                    <label for="cityAddress">市区町村・町域</label>
                    <input id="cityAddress" type="text" th:field="*{cityAddress}" autocomplete="address-level2">
                    <p class="error" th:if="${#fields.hasErrors('cityAddress')}" th:errors="*{cityAddress}"></p>
                </div>

                <div>
                    <label for="addressDetail">番地・建物名</label>
                    <input id="addressDetail" type="text" th:field="*{addressDetail}" maxlength="255" autocomplete="street-address">
                    <p class="error" th:if="${#fields.hasErrors('addressDetail')}" th:errors="*{addressDetail}"></p>
                </div>
            </fieldset>

            <div class="error" th:if="${#fields.hasGlobalErrors()}">
                <p th:each="error : ${#fields.globalErrors()}" th:text="${error}"></p>
            </div>

            <button type="submit">入力内容を確認する</button>
        </form>
    </main>

    <script>
        const postalCodeInput = document.getElementById('postalCode');
        const prefectureInput = document.getElementById('prefecture');
        const cityAddressInput = document.getElementById('cityAddress');
        const searchAddressButton = document.getElementById('searchAddress');
        const addressSearchMessage = document.getElementById('addressSearchMessage');

        searchAddressButton.addEventListener('click', async () => {
            const postalCode = postalCodeInput.value.replace(/[^0-9]/g, '');
            addressSearchMessage.textContent = '';

            if (!/^\d{7}$/.test(postalCode)) {
                addressSearchMessage.textContent = '郵便番号を7桁で入力してください。';
                return;
            }

            try {
                const response = await fetch(
                    'https://zipcloud.ibsnet.co.jp/api/search?zipcode=' + encodeURIComponent(postalCode));
                if (!response.ok) {
                    throw new Error('API request failed');
                }

                const data = await response.json();
                if (String(data.status) !== '200' || !Array.isArray(data.results) || data.results.length === 0) {
                    addressSearchMessage.textContent = '住所が見つかりません。都道府県と市区町村・町域を入力してください。';
                    return;
                }

                const result = data.results[0];
                prefectureInput.value = result.address1 || '';
                cityAddressInput.value = (result.address2 || '') + (result.address3 || '');
                addressSearchMessage.textContent = '住所を自動入力しました。必要に応じて修正してください。';
            } catch (error) {
                addressSearchMessage.textContent = '住所検索に失敗しました。都道府県と市区町村・町域を手入力してください。';
            }
        });
    </script>
</body>
</html>
