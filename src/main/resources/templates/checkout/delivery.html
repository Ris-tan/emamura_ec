<!DOCTYPE html>
<html lang="ja" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>受取方法・お届け先入力</title>
    <style>
        main {
            max-width: 640px;
            margin: 0 auto;
        }

        form {
            display: grid;
            gap: 1rem;
        }

        label {
            display: block;
            margin-bottom: 0.25rem;
        }

        input,
        select {
            box-sizing: border-box;
            width: 100%;
            padding: 0.5rem;
        }

        .error {
            color: #b00020;
        }
    </style>
</head>
<body>
    <main>
        <p><a th:href="@{/cart}">カートに戻る</a></p>
        <h1>受取方法・お届け先入力</h1>
        <p>店頭受取の場合は配送先情報の入力は任意です。</p>

        <form th:action="@{/checkout/delivery}"
              th:object="${checkoutDeliveryForm}"
              method="post">
            <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">

            <div>
                <label for="deliveryMethod">受取方法</label>
                <select id="deliveryMethod" th:field="*{deliveryMethod}">
                    <option value="">選択してください</option>
                    <option th:value="${T(emamura_ec.entity.DeliveryMethod).SHIPPING}">宅配便</option>
                    <option th:value="${T(emamura_ec.entity.DeliveryMethod).LOCAL_DELIVERY}">自店配達</option>
                    <option th:value="${T(emamura_ec.entity.DeliveryMethod).STORE_PICKUP}">店頭受取</option>
                </select>
                <p class="error" th:if="${#fields.hasErrors('deliveryMethod')}" th:errors="*{deliveryMethod}"></p>
            </div>

            <div>
                <label for="recipientName">受取人氏名</label>
                <input id="recipientName" type="text" th:field="*{recipientName}">
                <p class="error" th:if="${#fields.hasErrors('recipientName')}" th:errors="*{recipientName}"></p>
            </div>

            <div>
                <label for="phoneNumber">電話番号</label>
                <input id="phoneNumber" type="tel" th:field="*{phoneNumber}">
                <p class="error" th:if="${#fields.hasErrors('phoneNumber')}" th:errors="*{phoneNumber}"></p>
            </div>

            <div>
                <label for="postalCode">郵便番号</label>
                <input id="postalCode" type="text" th:field="*{postalCode}" placeholder="123-4567">
                <p class="error" th:if="${#fields.hasErrors('postalCode')}" th:errors="*{postalCode}"></p>
            </div>

            <div>
                <label for="prefecture">都道府県</label>
                <input id="prefecture" type="text" th:field="*{prefecture}">
                <p class="error" th:if="${#fields.hasErrors('prefecture')}" th:errors="*{prefecture}"></p>
            </div>

            <div>
                <label for="addressLine">住所</label>
                <input id="addressLine" type="text" th:field="*{addressLine}">
                <p class="error" th:if="${#fields.hasErrors('addressLine')}" th:errors="*{addressLine}"></p>
            </div>

            <div class="error" th:if="${#fields.hasGlobalErrors()}">
                <p th:each="error : ${#fields.globalErrors()}" th:text="${error}"></p>
            </div>

            <button type="submit">入力内容を確認する</button>
        </form>
    </main>
</body>
</html>
