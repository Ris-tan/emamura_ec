<!DOCTYPE html>
<html lang="ja" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>注文確認</title>
    <style>
        main {
            max-width: 820px;
            margin: 0 auto;
        }

        .item {
            display: grid;
            grid-template-columns: 120px 1fr;
            gap: 1rem;
            border-bottom: 1px solid #ddd;
            padding: 1rem 0;
        }

        .item img {
            width: 120px;
            height: 90px;
            object-fit: cover;
        }

        dt {
            font-weight: bold;
            margin-top: 0.75rem;
        }

        .amounts {
            border-top: 1px solid #333;
            margin-top: 1.5rem;
            padding-top: 1rem;
        }

        .total {
            font-size: 1.2rem;
            font-weight: bold;
        }

        .actions {
            display: flex;
            flex-wrap: wrap;
            gap: 1rem;
            margin-top: 1.5rem;
        }
    </style>
</head>
<body>
<main>
    <p><a th:href="@{/cart}">カートへ戻る</a></p>
    <h1>注文確認</h1>

    <section>
        <h2>商品</h2>
        <div class="item" th:each="item : ${checkoutConfirmView.items}">
            <img th:src="${item.imageUrl}" th:alt="${item.productName}">
            <div>
                <h3 th:text="${item.productName}">商品名</h3>
                <p>単価：<span th:text="${item.unitPrice}">0</span>円</p>
                <p>数量：<span th:text="${item.quantity}">0</span></p>
                <p>小計：<span th:text="${item.subtotal}">0</span>円</p>

                <div th:if="${checkoutConfirmView.giftEnabled}">
                    <h4>ギフト設定</h4>
                    <dl>
                        <dt>ラッピング</dt>
                        <dd th:text="${item.wrappingType.displayName}">なし</dd>
                        <dt>リボン</dt>
                        <dd th:text="${item.ribbonColor.displayName}">なし</dd>
                        <dt>メッセージカード</dt>
                        <dd th:if="${not #strings.isEmpty(item.messageText)}"
                            th:text="${item.messageText}">なし</dd>
                        <dd th:unless="${not #strings.isEmpty(item.messageText)}">なし</dd>
                    </dl>
                </div>
            </div>
        </div>
        <p th:unless="${checkoutConfirmView.giftEnabled}">ギフトオプションなし</p>
    </section>

    <section th:if="${checkoutConfirmView.giftEnabled}">
        <h2>紙袋</h2>
        <p>紙袋数量：<span th:text="${checkoutConfirmView.paperBagCount}">0</span>枚</p>
        <p>紙袋単価：<span th:text="${checkoutConfirmView.paperBagUnitPrice}">50</span>円</p>
        <p>紙袋料金：<span th:text="${checkoutConfirmView.paperBagTotal}">0</span>円</p>
    </section>

    <section>
        <h2>受取方法・お届け先</h2>
        <dl>
            <dt>受取方法</dt>
            <dd th:text="${checkoutConfirmView.deliveryMethodDisplayName}">お届け</dd>
            <dt>受取人氏名</dt>
            <dd th:text="${checkoutConfirmView.recipientName}">受取人氏名</dd>
            <dt>電話番号</dt>
            <dd th:text="${checkoutConfirmView.phoneNumber}">電話番号</dd>
        </dl>

        <dl th:if="${checkoutConfirmView.deliveryAddressVisible}">
            <dt>郵便番号</dt>
            <dd th:text="${checkoutConfirmView.postalCode}">郵便番号</dd>
            <dt>都道府県</dt>
            <dd th:text="${checkoutConfirmView.prefecture}">都道府県</dd>
            <dt>市区町村・町域</dt>
            <dd th:text="${checkoutConfirmView.cityAddress}">市区町村・町域</dd>
            <dt>番地・建物名</dt>
            <dd th:text="${checkoutConfirmView.addressDetail}">番地・建物名</dd>
        </dl>
    </section>

    <section class="amounts">
        <h2>金額</h2>
        <p>商品小計：<span th:text="${checkoutConfirmView.productSubtotal}">0</span>円</p>
        <p>送料：<span th:text="${checkoutConfirmView.shippingFee}">0</span>円</p>
        <p th:if="${checkoutConfirmView.giftEnabled}">
            紙袋料金：<span th:text="${checkoutConfirmView.paperBagTotal}">0</span>円
        </p>
        <p class="total">合計金額：<span th:text="${checkoutConfirmView.total}">0</span>円</p>
    </section>

    <div class="actions">
        <a th:href="@{/cart}">カートへ戻る</a>
        <a th:if="${checkoutConfirmView.giftEnabled}" th:href="@{/checkout/gift}">ギフト設定を変更する</a>
        <a th:href="@{/checkout/delivery}">配送情報を変更する</a>
        <button type="button" disabled>注文を確定する（次工程）</button>
    </div>
</main>
</body>
</html>
