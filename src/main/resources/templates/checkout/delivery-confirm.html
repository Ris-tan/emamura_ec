<!DOCTYPE html>
<html lang="ja" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('配送内容確認 | 花屋いまむら')}"></head>
<body>
<header th:replace="~{fragments/layout :: header}"></header>
<nav th:replace="~{fragments/layout :: checkoutSteps('delivery', ${checkoutGiftEnabled})}"></nav>

<main class="page-container checkout-layout narrow-container">
    <header class="page-header">
        <h1>配送内容確認</h1>
        <p>入力内容をご確認ください。</p>
    </header>

    <section class="summary-card">
        <h2>受取方法・お届け先</h2>
        <dl>
            <dt>受取方法</dt>
            <dd th:switch="${checkoutDeliveryData.deliveryMethod}">
                <span th:case="${T(emamura_ec.entity.DeliveryMethod).SHIPPING}">お届け</span>
                <span th:case="${T(emamura_ec.entity.DeliveryMethod).LOCAL_DELIVERY}">自店配達</span>
                <span th:case="${T(emamura_ec.entity.DeliveryMethod).STORE_PICKUP}">店頭受取</span>
            </dd>

            <dt>受取人氏名</dt>
            <dd th:text="${checkoutDeliveryData.recipientName}">受取人氏名</dd>
            <dt>電話番号</dt>
            <dd th:text="${checkoutDeliveryData.phoneNumber}">電話番号</dd>
        </dl>

        <dl th:if="${checkoutDeliveryData.postalCode != null}">
            <dt>郵便番号</dt>
            <dd th:text="${checkoutDeliveryData.postalCode}">9200001</dd>
            <dt>都道府県</dt>
            <dd th:text="${checkoutDeliveryData.prefecture}">石川県</dd>
            <dt>市区町村・町域</dt>
            <dd th:text="${checkoutDeliveryData.cityAddress}">金沢市○○町</dd>
            <dt>番地・建物名</dt>
            <dd th:text="${checkoutDeliveryData.addressDetail}">1-1-1</dd>
            <dt>送料</dt>
            <dd><span th:text="${checkoutDeliveryData.shippingFee}">0</span>円</dd>
        </dl>
        <p class="notice" th:unless="${checkoutDeliveryData.postalCode != null}">店頭受取のため、配送先住所と送料はありません。</p>
    </section>

    <div class="button-row">
        <a class="btn btn-secondary" th:href="@{/checkout/delivery}">配送情報を変更する</a>
        <a class="btn btn-primary" th:href="@{/checkout/confirm}">注文内容を確認する</a>
    </div>

    <p th:if="${checkoutGiftEnabled}"><a th:href="@{/checkout/gift}">ギフト設定を変更する</a></p>
    <p><a th:href="@{/cart}">カートへ戻る</a></p>
</main>

<footer th:replace="~{fragments/layout :: footer}"></footer>
</body>
</html>
