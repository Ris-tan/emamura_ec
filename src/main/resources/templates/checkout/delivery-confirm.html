<!DOCTYPE html>
<html lang="ja" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('配送内容確認 | 花屋いまむら')}"></head>
<body>
<header th:replace="~{fragments/layout :: header}"></header>
<nav th:replace="~{fragments/layout :: checkoutSteps('delivery', ${checkoutGiftEnabled})}"></nav>

<main class="page-container checkout-layout narrow-container">
    <header class="page-header">
        <h1>配送内容確認</h1>
        <p>入力内容をご確認ください。</p>
    </header>

    <section class="summary-card delivery-confirm-card">
        <h2>受取方法・お届け先</h2>
        <dl class="confirmation-list">
            <dt>受取方法</dt>
            <dd th:switch="${checkoutDeliveryData.deliveryMethod}">
                <span th:case="${T(emamura_ec.entity.DeliveryMethod).SHIPPING}">お届け</span>
                <span th:case="${T(emamura_ec.entity.DeliveryMethod).LOCAL_DELIVERY}">自店配達</span>
                <span th:case="${T(emamura_ec.entity.DeliveryMethod).STORE_PICKUP}">店頭受取</span>
            </dd>

            <dt>受取人氏名</dt>
            <dd th:text="${checkoutDeliveryData.recipientName}">受取人氏名</dd>
            <dt>電話番号</dt>
            <dd th:text="${checkoutDeliveryData.phoneNumber}">電話番号</dd>
        </dl>

        <dl class="confirmation-list" th:if="${checkoutDeliveryData.postalCode != null}">
            <dt>郵便番号</dt>
            <dd th:text="${checkoutDeliveryData.postalCode}">9200001</dd>
            <dt>住所</dt>
            <dd>
                <span th:text="${checkoutDeliveryData.prefecture}">石川県</span>
                <span th:text="${checkoutDeliveryData.cityAddress}">金沢市○○町</span>
                <span th:text="${checkoutDeliveryData.addressDetail}">1-1-1</span>
            </dd>
            <dt th:if="${checkoutDeliveryData.deliveryMethod == T(emamura_ec.entity.DeliveryMethod).SHIPPING}">送料</dt>
            <dd th:if="${checkoutDeliveryData.deliveryMethod == T(emamura_ec.entity.DeliveryMethod).SHIPPING}">
                <span th:text="${checkoutDeliveryData.shippingFee}">0</span>円
            </dd>
        </dl>
        <p class="notice" th:unless="${checkoutDeliveryData.postalCode != null}">店頭受取のため、配送先住所と送料はありません。</p>

        <div class="delivery-date-section" th:if="${deliveryScheduleVisible}">
            <h3>お届け日</h3>
            <dl class="confirmation-list">
                <dt class="earliest-delivery-date">最短お届け予定日</dt>
                <dd class="earliest-delivery-date" th:text="${earliestDeliveryDateDisplay}">8月29日</dd>
            </dl>
        </div>

        <form class="checkout-date-form"
              th:action="@{/checkout/delivery/confirm}"
              th:object="${checkoutDeliveryConfirmForm}"
              method="post">
            <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">
            <div class="form-group delivery-date-input" th:if="${deliveryScheduleVisible}">
                <label for="requestedDeliveryDate">お届け希望日（任意）</label>
                <input id="requestedDeliveryDate" type="date"
                       th:field="*{requestedDeliveryDate}"
                       th:min="${earliestDeliveryDate}">
                <p class="help-text">
                    ※<span th:text="${earliestDeliveryDateDisplay}">8月29日</span>以降をご指定いただけます
                </p>
                <p class="error" th:if="${#fields.hasErrors('requestedDeliveryDate')}"
                   th:errors="*{requestedDeliveryDate}"></p>
            </div>
            <p class="error" th:if="${deliveryError}" th:text="${deliveryError}"></p>
            <div class="button-row checkout-confirm-actions">
                <a class="btn btn-secondary" th:href="@{/checkout/delivery}">配送情報を変更する</a>
                <button class="btn btn-primary" type="submit">この配送内容で進む</button>
            </div>
        </form>
    </section>

    <div class="checkout-tertiary-links">
        <p th:if="${checkoutGiftEnabled}"><a th:href="@{/checkout/gift}">ギフト設定を変更する</a></p>
        <p><a th:href="@{/cart}">カートへ戻る</a></p>
    </div>
</main>

<footer th:replace="~{fragments/layout :: footer}"></footer>
</body>
</html>
