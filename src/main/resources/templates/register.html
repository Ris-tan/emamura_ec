<!DOCTYPE html>
<html lang="ja" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('会員登録 | 花屋いまむら')}"></head>
<body>
<header th:replace="~{fragments/layout :: header}"></header>

<main class="page-container narrow-container">
    <a class="back-link" th:href="@{/}">← トップページへ戻る</a>
    <header class="page-header">
        <h1>会員登録</h1>
        <p>お買い物を始めるための情報を入力してください。</p>
    </header>

    <form class="form-card" th:action="@{/register}" th:object="${registerForm}" method="post">
        <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">

        <div class="form-group">
            <label class="required" for="name">氏名</label>
            <input id="name" type="text" th:field="*{name}" autocomplete="name">
            <p class="field-error" th:if="${#fields.hasErrors('name')}" th:errors="*{name}"></p>
        </div>

        <div class="form-group">
            <label class="required" for="email">メールアドレス</label>
            <input id="email" type="email" th:field="*{email}" autocomplete="email">
            <p class="field-error" th:if="${#fields.hasErrors('email')}" th:errors="*{email}"></p>
        </div>

        <div class="form-group">
            <label class="required" for="password">パスワード</label>
            <div class="password-input">
                <input id="password" type="password" th:field="*{password}" autocomplete="new-password">
                <button class="btn btn-secondary password-toggle" type="button"
                        data-target="password" aria-controls="password" aria-pressed="false">表示</button>
            </div>
            <p class="field-error" th:if="${#fields.hasErrors('password')}" th:errors="*{password}"></p>
        </div>

        <div class="form-group">
            <label class="required" for="passwordConfirmation">パスワード（確認）</label>
            <div class="password-input">
                <input id="passwordConfirmation" type="password" th:field="*{passwordConfirmation}" autocomplete="new-password">
                <button class="btn btn-secondary password-toggle" type="button"
                        data-target="passwordConfirmation" aria-controls="passwordConfirmation" aria-pressed="false">表示</button>
            </div>
            <p class="field-error" th:if="${#fields.hasErrors('passwordConfirmation')}" th:errors="*{passwordConfirmation}"></p>
        </div>

        <div class="form-group">
            <label class="required" for="phoneNumber">電話番号</label>
            <input id="phoneNumber" type="tel" th:field="*{phoneNumber}" autocomplete="tel">
            <p class="field-error" th:if="${#fields.hasErrors('phoneNumber')}" th:errors="*{phoneNumber}"></p>
        </div>

        <div class="form-group">
            <label for="birthDate">生年月日（任意）</label>
            <input id="birthDate" type="date" th:field="*{birthDate}">
            <p class="field-error" th:if="${#fields.hasErrors('birthDate')}" th:errors="*{birthDate}"></p>
        </div>

        <button class="btn btn-primary" type="submit">会員登録する</button>
    </form>
</main>

<footer th:replace="~{fragments/layout :: footer}"></footer>

<script>
    document.querySelectorAll('.password-toggle').forEach((button) => {
        const input = document.getElementById(button.dataset.target);

        button.addEventListener('click', () => {
            const visible = input.type === 'password';
            input.type = visible ? 'text' : 'password';
            button.textContent = visible ? '非表示' : '表示';
            button.setAttribute('aria-pressed', String(visible));
        });
    });
</script>
</body>
</html>
