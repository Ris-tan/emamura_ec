<!DOCTYPE html>
<html lang="ja" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('マイページ | 花屋いまむら')}"></head>
<body>
<header th:replace="~{fragments/layout :: header}"></header>

<main class="page-container narrow-container">
    <header class="page-header">
        <h1>マイページ</h1>
        <p>注文やお届け先を管理できます。</p>
    </header>

    <div class="mypage-menu">
        <a class="card mypage-menu__card" th:href="@{/orders}">
            <h2>注文履歴</h2>
            <p>これまでの注文内容を確認します。</p>
        </a>
        <a class="card mypage-menu__card" th:href="@{/mypage/addresses}">
            <h2>お届け先管理</h2>
            <p>保存済みのお届け先を登録・編集します。</p>
        </a>
        <section class="card mypage-menu__card">
            <h2>LINE通知</h2>
            <p>未連携</p>
            <p class="help-text">LINE連携機能は今後対応予定です。</p>
        </section>
    </div>
</main>

<footer th:replace="~{fragments/layout :: footer}"></footer>
</body>
</html>
