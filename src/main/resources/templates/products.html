<!DOCTYPE html>
<html lang="ja" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('商品一覧 | 花屋いまむら')}"></head>
<body>
<header th:replace="~{fragments/layout :: header}"></header>

<main class="page-container">
    <header class="page-header">
        <h1>商品一覧</h1>
        <p>季節のおすすめをお選びください。</p>
    </header>

    <p class="card" th:if="${#lists.isEmpty(products)}">現在、表示できる商品はありません。</p>
    <ul class="product-grid" th:unless="${#lists.isEmpty(products)}">
        <li class="product-card" th:each="product : ${products}">
            <img class="product-card__image"
                 th:src="@{${product.imageUrl}}"
                 th:alt="${product.productName}">
            <div class="product-card__body">
                <h2 th:text="${product.productName}">商品名</h2>
                <p class="price"><span th:text="${product.price}">0</span>円</p>
                <a class="btn btn-secondary" th:href="@{/products/{id}(id=${product.productId})}">詳細を見る</a>
            </div>
        </li>
    </ul>
</main>

<footer th:replace="~{fragments/layout :: footer}"></footer>
</body>
</html>
